apiVersion: apps/v1
kind: Deployment
metadata:
  name: creditrisk-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: creditrisk-api
  template:
    metadata:
      labels:
        app: creditrisk-api
    spec:
      containers:
        - name: creditrisk-api
          image: 123537042913.dkr.ecr.us-east-1.amazonaws.com/credict_risk_prediction-gradio:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000